name: Update profile cards

# What the cards show is not configured here -- it lives in card.config.json.
#
# The reason is mechanical. A token without the `workflow` scope cannot write to
# .github/workflows/**: GitHub answers 404, and no entry in a `permissions:` block grants
# it. So anything kept in this file could never be updated for you, while anything kept
# in card.config.json can. This file holds only what a configuration file cannot: the
# secrets, and where the checkouts landed.

on:
  schedule:
    # 04:12 UTC. Avoids the midnight slot, which is the most contended and the most
    # likely to be delayed or dropped by GitHub's scheduler.
    - cron: "12 4 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Render and print the numbers without committing"
        type: boolean
        default: false

jobs:
  cards:
    runs-on: ubuntu-latest
    # Only so the built-in token can check this repo out. The cards are written to
    # your profile repository with PROFILE_WRITE_TOKEN instead.
    permissions:
      contents: read

    steps:
      # actions/checkout is the only action used, and it is GitHub's own. Nothing is
      # installed at run time, so no third-party code ever sees your token.
      - name: Check out the generator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: generator

      - name: Check out the profile repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Your profile repository is the one named after you.
          repository: ${{ github.repository_owner }}/${{ github.repository_owner }}
          token: ${{ secrets.PROFILE_WRITE_TOKEN }}
          path: profile-repo

      - name: Render the cards
        env:
          # Falls back to the token Actions provides if you never made one. That one
          # sees only public activity, so rows needing private access are dropped
          # rather than filled with a public-only figure.
          STATS_TOKEN: ${{ secrets.STATS_READ_PAT || secrets.GITHUB_TOKEN }}
          STATS_USERNAME: ${{ github.repository_owner }}
          # Where the checkout above put your profile repository. The output paths in
          # card.config.json resolve inside it.
          PROFILE_DIR: profile-repo
        run: node generator/scripts/render.mjs

      - name: Commit the cards if they changed
        if: inputs.dry_run != true
        working-directory: profile-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Whatever the run wrote, wherever card.config.json pointed it. Naming the two
          # files here would mean a workflow edit to move one, which is the edit this
          # setup exists to avoid.
          git add -A
          git commit -m "Update profile cards" || exit 0
          git push
