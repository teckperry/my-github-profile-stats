name: Count adopters

# Redraws the badge in the readme. No external service is involved: the count comes from
# GitHub's code search over the signature the cards carry, and the badge is drawn here and
# committed, rather than fetched from a badge service when somebody opens the page.

on:
  schedule:
    # Daily, off the hour because the top of one is the most contended slot. It does not
    # buy much: measured over 25 runs, this lands between 09:38 and 13:28 UTC rather than
    # at 05:37. GitHub delays a scheduled workflow by hours and nothing here changes that,
    # which is fine for a figure that moves once a week.
    - cron: "37 5 * * *"
  workflow_dispatch:

jobs:
  count:
    # This belongs to the project, not to a copy of it. A copy inherits the file, and
    # without this guard it would run daily, search for the signature and commit somebody
    # else's adopter count into the copy's own readme, on the copy's own minutes.
    if: github.repository == 'teckperry/my-github-profile-stats'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Count and write
        env:
          # Code search will not answer unauthenticated. The built-in token is enough
          # because everything being searched is public.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/adopters.mjs --write

      - name: Commit if the number changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/adopters.svg
          git commit -m "chore: refresh the adopter count" || exit 0
          git push
